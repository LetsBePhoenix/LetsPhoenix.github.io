<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LetsPhoenix — Games</title>
  <meta name="description" content="Browser-Spiele von LetsPhoenix – direkt spielbar, ohne Installation.">
  <link id="theme-stylesheet" rel="stylesheet" href="style_Phoenix.css">
  <script src="boot.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Fredoka:wght@500;600;700&family=Rubik+Glitch&family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preload" href="style_Phoenix.css"   as="style">
  <link rel="preload" href="style_War-Crime.css" as="style">
  <link rel="preload" href="style_Glacier.css"   as="style">
  <link rel="preload" href="style_Midnight.css"  as="style">
  <link rel="preload" href="style_Ruins.css"     as="style">
  <link rel="preload" href="style_Sakura.css"    as="style">
  <style>
    /* ── Hervorgehobenes Spiel ── */
    .feature { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); text-decoration: none; color: var(--text); }
    .feature::before { z-index: 2; }
    .feature:hover { border-color: var(--accent); }
    .feature-media { position: relative; min-height: 320px; overflow: hidden; background: var(--bg2); }
    .feature-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
    .feature:hover .feature-media img { transform: scale(1.05); }
    .feature-media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 55%, var(--surface)); }
    .feature-body { padding: 2.2rem; display: flex; flex-direction: column; gap: .9rem; align-items: flex-start; justify-content: center; min-width: 0; }
    .feature-title { font: 700 clamp(2rem, 4.4vw, 3.2rem)/1 var(--font-display); letter-spacing: .03em; text-transform: uppercase; margin: 0; }
    .feature-title i { color: var(--g, var(--accent)); margin-right: .35rem; font-size: .8em; }
    .feature-desc { color: var(--text2); margin: 0; max-width: 48ch; }
    .feature-row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
    .press { font: .72rem var(--font-mono); color: var(--text2); display: inline-flex; gap: .4rem; align-items: center; }

    /* ── Bibliothek ── */
    .lib-bar { display: flex; flex-wrap: wrap; gap: .8rem 1.2rem; align-items: center; justify-content: space-between; }
    .lib-count { font: .76rem var(--font-mono); color: var(--text2); }
    .lib-count b { color: var(--accent); }
    .ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 1rem; }
    .gcard { display: flex; flex-direction: column; text-decoration: none; color: var(--text); }
    .gcard::before { z-index: 2; }
    .gcard:hover { transform: translateY(-5px); box-shadow: var(--shadow), 0 20px 44px -22px rgba(var(--accent-rgb), .6); }
    .gcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .gcard.pressed { transform: translateY(-2px) scale(.98); border-color: var(--accent); }
    .gcard-thumb { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: var(--bg2); border-bottom: 2px solid var(--g, var(--accent)); }
    .gcard-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.85); transition: transform .5s, filter .3s; }
    .gcard:hover .gcard-thumb img { transform: scale(1.07); filter: saturate(1.1); }
    .gcard-play {
      position: absolute; inset: 0; z-index: 1; display: grid; place-items: center;
      background: rgba(0,0,0,.45); opacity: 0; transition: opacity .25s;
    }
    .gcard-play span {
      display: grid; place-items: center; width: 58px; height: 58px; font-size: 1.2rem;
      background: var(--accent); color: var(--btn-text); transform: scale(.8); transition: transform .25s;
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    }
    .gcard:hover .gcard-play, .gcard:focus-visible .gcard-play { opacity: 1; }
    .gcard:hover .gcard-play span { transform: scale(1); }
    .gcard-thumb .badge { position: absolute; left: .6rem; top: .6rem; z-index: 2; }
    .gcard-key { position: absolute; right: .6rem; top: .6rem; z-index: 2; }
    .gcard-body { padding: 1.05rem 1.15rem 1.15rem; display: flex; flex-direction: column; gap: .45rem; flex: 1; }
    .gcard-title { font: 700 1.25rem/1.15 var(--font-display); letter-spacing: .03em; margin: 0; display: flex; align-items: center; gap: .55rem; }
    .gcard-title i { color: var(--g, var(--accent)); font-size: .95rem; width: 1.2em; text-align: center; }
    .gcard-desc { font-size: .88rem; color: var(--text2); margin: 0; flex: 1; }
    .gcard-foot { display: flex; justify-content: space-between; align-items: center; gap: .6rem; margin-top: .4rem; padding-top: .65rem; border-top: 1px dashed var(--border); }
    .gcard-go { font: 700 .72rem var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); display: inline-flex; gap: .45rem; align-items: center; transition: gap .25s; }
    .gcard:hover .gcard-go { gap: .8rem; }

    /* Looks */
    :root[data-look="cute"] .gcard-play span { clip-path: none; border-radius: 50%; }
    :root[data-look="cute"] :is(.feature-title, .gcard-title) { text-transform: none; }
    :root[data-look="retro"] .gcard-play span { clip-path: none; border: 3px solid var(--text); }
    :root[data-look="retro"] .feature-title { font-size: clamp(1.1rem, 3vw, 1.9rem); line-height: 1.35; letter-spacing: 0; }
    :root[data-look="retro"] .gcard-title { font-size: .78rem; line-height: 1.55; letter-spacing: 0; }
    :root[data-look="retro"] .gcard-go { font-family: var(--font-display); font-size: .5rem; letter-spacing: 0; }
    :root[data-look="broken"] .gcard:hover { animation: jitter .25s steps(2) infinite; }
    :root[data-look="broken"] .gcard-play span { animation: rgb-split 3s steps(1) infinite; }

    @media (hover: none) { .gcard-key { display: none; } }
    @media (max-width: 860px) {
      .feature { grid-template-columns: 1fr; }
      .feature-media { min-height: 210px; }
      .feature-media::after { background: linear-gradient(180deg, transparent 45%, var(--surface)); }
      .feature-body { padding: 1.4rem 1.3rem 1.6rem; }
    }
  </style>
</head>
<body data-page="games">

<header class="page-head">
  <div class="page-head-inner">
    <p class="cmd"><span>$</span> ./games --list</p>
    <h1>Meine <span>Games</span></h1>
    <p class="page-sub">Browser-Spiele, die ich selbst entwickelt habe. Direkt spielbar, ohne Installation.</p>
    <div class="stats" id="g-stats"></div>
  </div>
</header>

<main>
  <section id="g-feature" aria-label="Empfohlenes Spiel"></section>

  <section class="block" aria-labelledby="lib-title">
    <div class="block-head">
      <p class="cmd"><span>$</span> ls ./bibliothek</p>
      <h2 id="lib-title">Bibliothek</h2>
      <p class="block-sub">Tipp: Mit den Zahlentasten <kbd>1</kbd> bis <kbd id="g-maxkey">6</kbd> startest du ein Spiel direkt.</p>
    </div>
    <div class="lib-bar">
      <div class="chip-row" id="g-genres" role="group" aria-label="Nach Genre filtern"></div>
      <span class="lib-count" id="g-count"></span>
    </div>
    <div class="ggrid wear" id="g-grid"></div>
  </section>
</main>

<script src="layout.js"></script>
<script>
/* ───────────────────────────────────────────────────
   Spiele-Daten – neue Spiele einfach hier eintragen.
   icon:     Font-Awesome-Symbol (https://fontawesome.com/icons)
   color:    Akzentfarbe der Karte
   featured: true = groß oben als empfohlenes Spiel anzeigen (nur bei einem Spiel)
   isNew:    true = Abzeichen „Neu“ auf der Kachel
   ─────────────────────────────────────────────────── */
const games = [
  {
    id: 'sandbox', title: 'Sandbox', genre: 'Sandbox', icon: 'fa-shapes', color: '#f5b942', featured: true, isNew: true,
    desc: 'Eine offene Spielwiese ohne festes Ziel: Baue, experimentiere und probiere aus, was passiert.',
    image: 'images/SandboxGame.png', url: 'games/PnxSandbox/Pnx-Sandbox.html'
  },
  {
    id: 'apocalypse', title: 'Apocalypse', genre: 'Survival', icon: 'fa-biohazard', color: '#52c462',
    desc: 'Überlebe die Apokalypse! Ein actiongeladenes Survival-Spiel mit Zombies und Ressourcenmanagement.',
    image: 'images/ApocolypseGame.png', url: 'games/Apocalypse/index.html'
  },
  {
    id: 'astroshoot', title: 'AstroShoot', genre: 'Shooter', icon: 'fa-rocket', color: '#00d4c8',
    desc: 'Klassisches Space-Shooter-Gameplay. Zerstöre Asteroiden und verteidige die Galaxis.',
    image: 'images/AstroshootGame.png', url: 'games/AstroShoot/index.html'
  },
  {
    id: 'astroshootnew', title: 'AstroShoot NEW', genre: 'Shooter', icon: 'fa-shuttle-space', color: '#0099e6',
    desc: 'Die überarbeitete Version von AstroShoot mit neuen Features, besserer Grafik und mehr Action.',
    image: 'images/AstroshootNewGame.png', url: 'games/AstroShootNew/index.html'
  },
  {
    id: 'blockbreaker', title: 'BlockBreaker', genre: 'Breakout', icon: 'fa-cubes-stacked', color: '#e03030',
    desc: 'Klassisches Breakout-Feeling. Zertrümmere alle Blöcke mit deinem Ball und verliere ihn nicht.',
    image: 'images/BlockBreakerGame.png', url: 'games/BlockBreaker/index.html'
  },
  {
    id: 'tictactoe', title: 'TicTacToe', genre: 'Strategie', icon: 'fa-hashtag', color: '#9d6fff',
    desc: 'Das klassische Strategiespiel für zwei Spieler. Wer zuerst drei in einer Reihe hat, gewinnt.',
    image: 'images/TicTacToeGame.png', url: 'games/TicTacToe/TicTacToe.html'
  },
  {
    id: 'shootthedude', title: 'ShootTheDude', genre: 'Shooter', icon: 'fa-crosshairs', color: '#ff8c00',
    desc: 'Schnelle Reflexe gefragt! Eliminiere die Targets so schnell wie möglich – Time Attack Modus.',
    image: 'images/ShootTheDudeGame.png', url: 'games/ShootTheDude/index.html'
  },
  {
    id: 'beatthephoenix', title: 'BeatThePhoenix', genre: 'Arcade', icon: 'fa-fire', color: '#ff6030', isNew: true,
    desc: 'Stell dich der Herausforderung in BeatThePhoenix!',
    image: 'images/BeatThePhoenixGame.png', url: './games/BeatThePhoenix/BeatThePhoenix.html'
  }
];

(() => {
  const { esc } = window.LP;
  const $ = (s) => document.querySelector(s);
  const genres = [...new Set(games.map((g) => g.genre))];
  let genre = '';

  const thumb = (g) => `<img src="${esc(g.image)}" alt="" loading="lazy" data-game="${esc(g.id)}">`;
  const gen = (g) => `<div class="gen-cover" style="--g:${esc(g.color)}" aria-hidden="true"><i class="fas ${esc(g.icon)}"></i><small>${esc(g.genre)}</small></div>`;
  // Screenshot fehlt → Platzhalter mit Symbol
  document.addEventListener('error', (e) => {
    const img = e.target;
    if (img instanceof HTMLImageElement && img.dataset.game) {
      const g = games.find((x) => x.id === img.dataset.game);
      if (g) img.outerHTML = gen(g);
    }
  }, true);

  $('#g-stats').innerHTML = [
    [games.length, 'Spiele'], [genres.length, 'Genres'], ['0', 'Downloads nötig'], ['JS', 'Technik']
  ].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');

  const f = games.find((g) => g.featured);
  if (f) {
    $('#g-feature').innerHTML = `
      <a href="${esc(f.url)}" class="feature hud" style="--g:${esc(f.color)}" data-cursor="Spielen">
        <div class="feature-media">${thumb(f)}</div>
        <div class="feature-body">
          <span class="badge is-new"><i class="fas fa-star" aria-hidden="true"></i>Empfohlen</span>
          <h2 class="feature-title"><i class="fas ${esc(f.icon)}" aria-hidden="true"></i>${esc(f.title)}</h2>
          <p class="feature-desc">${esc(f.desc)}</p>
          <div class="feature-row">
            <span class="btn btn-lg"><i class="fas fa-play" aria-hidden="true"></i> Jetzt spielen</span>
            <span class="tag">${esc(f.genre)}</span>
          </div>
          <span class="press"><kbd>Enter</kbd> drücken, wenn markiert</span>
        </div>
      </a>`;
  }

  $('#g-maxkey').textContent = Math.min(9, games.length);
  $('#g-genres').innerHTML = [['', 'Alle', games.length], ...genres.map((x) => [x, x, games.filter((g) => g.genre === x).length])]
    .map(([v, l, n]) => `<button type="button" class="chip" data-genre="${esc(v)}" aria-pressed="${v === ''}">${esc(l)} <span class="n">${n}</span></button>`).join('');
  $('#g-genres').addEventListener('click', (e) => {
    const b = e.target.closest('[data-genre]');
    if (!b) return;
    genre = b.dataset.genre;
    render();
  });

  function render() {
    const list = genre ? games.filter((g) => g.genre === genre) : games;
    document.querySelectorAll('#g-genres [data-genre]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.genre === genre)));
    $('#g-count').innerHTML = `<b>${list.length}</b> ${list.length === 1 ? 'Spiel' : 'Spiele'} verfügbar`;
    $('#g-grid').innerHTML = list.map((g) => {
      const n = games.indexOf(g) + 1;
      return `
      <a href="${esc(g.url)}" class="gcard hud" style="--g:${esc(g.color)}" data-cursor="Spielen" data-num="${n}">
        <div class="gcard-thumb">${thumb(g)}
          ${g.isNew ? '<span class="badge is-new">Neu</span>' : ''}
          ${n <= 9 ? `<kbd class="gcard-key">${n}</kbd>` : ''}
          <div class="gcard-play" aria-hidden="true"><span><i class="fas fa-play"></i></span></div>
        </div>
        <div class="gcard-body">
          <h3 class="gcard-title"><i class="fas ${esc(g.icon)}" aria-hidden="true"></i>${esc(g.title)}</h3>
          <p class="gcard-desc">${esc(g.desc)}</p>
          <div class="gcard-foot">
            <span class="tag">${esc(g.genre)}</span>
            <span class="gcard-go">Spielen <i class="fas fa-angles-right" aria-hidden="true"></i></span>
          </div>
        </div>
      </a>`;
    }).join('') || '<div class="empty-state"><b>Keine Spiele</b>In diesem Genre gibt es noch nichts.</div>';
  }
  render();

  // Zahlentasten starten ein Spiel
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || !/^[1-9]$/.test(e.key)) return;
    if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"], .customize-panel')) return;
    const g = games[+e.key - 1];
    if (!g) return;
    const card = document.querySelector(`.gcard[data-num="${e.key}"]`);
    if (card) { card.classList.add('pressed'); card.focus({ preventScroll: true }); }
    window.LP.say('Starte ' + g.title + ' …');
    setTimeout(() => { location.href = g.url; }, 220);
  });
})();
</script>
<script src="script.js"></script>
</body>
</html>
