    icon: 🌌

  - name: Wüstenwind
    datei: pnx_wueste.wav
    icon: 🏜

  - name: Schneeglocken
    datei: pnx_winter.wav
    icon: ❄️

  - name: Abenteuer
    datei: pnx_abenteuer.wav
    icon: 💥
